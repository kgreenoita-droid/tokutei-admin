function genCode(){const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';const s=n=>Array.from({length:n},()=>c[Math.floor(Math.random()*c.length)]).join('');return `${s(4)}-${s(4)}-${s(4)}`;}

function generateIQs(scores){
  const {O,C,E,A,N}=scores,qs=[];
  qs.push('日本での就労を希望した、一番の理由を教えてください。');
  // 誠実性
  if(C>=70) qs.push('これまでの仕事や学習で、自分で決めたルールやペースを守るために工夫していたことはありますか？');
  else if(C<40) qs.push('仕事でミスをしてしまった経験があれば教えてください。その後どう対処しましたか？');
  // 外向性×協調性の組み合わせ
  if(E>=65&&A>=65) qs.push('職場でのリーダー役や、まとめ役を担った経験はありますか？どのようにチームをまとめましたか？');
  else if(E>=65&&A<45) qs.push('自分の意見と上司・同僚の意見が違ったとき、どのように対応しましたか？具体的な場面を教えてください。');
  else if(E<45&&A>=65) qs.push('グループの中では聞き役に回ることが多いですか？自分から意見を言うタイプですか？その理由も聞かせてください。');
  else if(E<45&&A<45) qs.push('一人で黙々と進める仕事と、チームで協力して進める仕事、どちらが得意ですか？なぜそう思いますか？');
  else qs.push('職場の同僚とうまくやっていくために、普段から心がけていることはありますか？');
  // 開放性
  if(O>=70) qs.push('日本の文化や習慣で、特に興味を持っていることや、すでに勉強していることはありますか？');
  else if(O<40) qs.push('これまで経験したことのない新しい仕事を任されたとき、どのように取り組みましたか？');
  // 神経症傾向
  if(N>=70){
    qs.push('仕事でプレッシャーや不安を感じたとき、どのように気持ちを整えてきましたか？');
    if(C>=60) qs.push('困ったことがあったとき、上司や周囲に相談できるタイプですか？それとも自分で解決しようとしますか？');
  } else if(N<35){
    qs.push('これまでに職場で大きなトラブルや失敗があったとき、どのように行動しましたか？');
  }
  // 組み合わせ追加
  if(C>=70&&E>=70) qs.push('仕事が重なって忙しくなったとき、優先順位をどのように決めますか？');
  if(O>=70&&N>=70) qs.push('新しい環境に入ったとき、最初の1週間はどのように過ごしますか？慣れるまでに心がけていることは？');
  return qs.slice(0,6);
}

function overallComment(scores){
  const {O,C,E,A,N}=scores;
  const lv=s=>s>=70?'H':s>=45?'M':'L';
  const [lo,lc,le,la,ln]=[lv(O),lv(C),lv(E),lv(A),lv(N)];
  let body='';

    body='責任感と行動力を兼ね備えており、自ら動きながら周囲を引っ張るタイプです。指示待ちになりにくく、現場でのリーダー的役割も期待できます。';

    body='口数は少なくても、一度任された仕事を丁寧にやり遂げる粘り強さがあります。コツコツ取り組む作業で高い成果を発揮するタイプです。';
  else if(le==='H'&&la==='L')
    body='積極的に発言・行動できる一方、自分の考えを優先しやすい面があります。チームでの役割分担や上下関係について、採用後のフォローが重要です。';
  else if(la==='H'&&le==='L')
    body='争いを好まず、周囲の状況をよく見ながら動く調和型です。派手さはありませんが、チームの雰囲気を安定させる存在になりやすいです。';
  else if(lo==='H'&&le==='H')
    body='新しい環境や業務に対して前向きで、自ら情報を取りに行く姿勢があります。異文化適応が早く、職場に溶け込むスピードが期待できます。';
  else if(lo==='L'&&le==='L')
    body='変化より安定を好み、決まった手順の中で着実に仕事を進めるタイプです。ルーティン業務や決まった役割での長期就労に向いています。';
  else if(ln==='H'&&lc==='H')
    body='真面目でプレッシャーに敏感なタイプです。責任感が強い分、失敗を深刻に捉えすぎることがあります。ミスへの声かけと定期的なフォローアップが効果的です。';
  else if(ln==='L')
    body='感情が安定しており、職場環境の変化や多少の困難に動じにくいタフさがあります。異国での就労という環境変化への適応力も期待できます。';
  else{
    const high=[];
    if(O>=65)high.push('好奇心・柔軟性');if(C>=65)high.push('責任感・計画性');
    if(E>=65)high.push('積極性');if(A>=65)high.push('協調性');if(N<40)high.push('精神的安定感');
    const hStr=high.length?`特に「${high.slice(0,2).join('・')}」が目立ちます。`:'各軸がバランスよく中程度の水準です。';
    body=`特定の軸が際立つというよりも、バランスの取れたプロフィールです。${hStr}`;
  }
  let note='';
  if(N>=70&&C<55) note='ストレス耐性とセルフマネジメントの部分は、入職後のサポート体制を整えておくと安心です。';
  else if(A<40&&E>=65) note='コミュニケーションはとれますが、協調面のフォローを意識的に行うことをお勧めします。';
  else if(C<40) note='業務の自己管理や報連相の習慣については、入職後に丁寧に確認・指導してください。';
  else if(lo==='L'&&le==='L') note='慣れない業務や急な変更が続く職場では、早期離職リスクに注意が必要です。';
  return body+(note?' '+note:'');
}

// ─── SVGレーダー（個別・塗りあり）★サイズ: 380px ───
function makeRadarSVG(scores, size, color){
  const keys=Object.keys(scores);
  const cx=size/2, cy=size/2, r=size*0.36, lvs=5;
  const ang=i=>(2*Math.PI*i)/keys.length;
  const pt=(i,radius)=>({x:cx+radius*Math.sin(ang(i)),y:cy-radius*Math.cos(ang(i))});
  const gridLines=Array.from({length:lvs},(_,li)=>{
    const rr=(r*(li+1))/lvs;
    const pts=keys.map((_,i)=>{const p=pt(i,rr);return `${p.x},${p.y}`;}).join(' ');
    return `<polygon points="${pts}" fill="none" stroke="#d0d0d0" stroke-width="0.7"/>`;
  }).join('');
  const axes=keys.map((_,i)=>{const p=pt(i,r);return `<line x1="${cx}" y1="${cy}" x2="${p.x}" y2="${p.y}" stroke="#d0d0d0" stroke-width="0.7"/>`;}).join('');
  const datapts=keys.map((d,i)=>{const p=pt(i,r*scores[d]/100);return `${p.x},${p.y}`;}).join(' ');
  const dots=keys.map((d,i)=>{const p=pt(i,r*scores[d]/100);return `<circle cx="${p.x}" cy="${p.y}" r="5" fill="${color}" stroke="white" stroke-width="1.8"/>`;}).join('');
  const lblR=r+22;
  const labels=keys.map((d,i)=>{
    const p=pt(i,lblR);
    return `<text x="${p.x}" y="${p.y}" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="bold" fill="${DIMS[d].color}">${DIMS[d].icon} ${DIMS[d].ja.name}</text>`;
  }).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg" style="display:block;margin:0 auto">
    ${gridLines}${axes}
    <polygon points="${datapts}" fill="${color}" fill-opacity="0.15" stroke="${color}" stroke-width="2.5"/>
    ${dots}${labels}
  </svg>`;
}

// ─── SVGレーダー（比較・塗りなし）★サイズ: 460px ───
function makeGroupRadarSVG(records, size){
  const keys=Object.keys(records[0].scores);
  const cx=size/2, cy=size/2, r=size*0.36, lvs=5;
  const ang=i=>(2*Math.PI*i)/keys.length;
  const pt=(i,radius)=>({x:cx+radius*Math.sin(ang(i)),y:cy-radius*Math.cos(ang(i))});
  const gridLines=Array.from({length:lvs},(_,li)=>{
    const rr=(r*(li+1))/lvs;
    const pts=keys.map((_,i)=>{const p=pt(i,rr);return `${p.x},${p.y}`;}).join(' ');
    return `<polygon points="${pts}" fill="none" stroke="#d0d0d0" stroke-width="0.7"/>`;
  }).join('');
  const axes=keys.map((_,i)=>{const p=pt(i,r);return `<line x1="${cx}" y1="${cy}" x2="${p.x}" y2="${p.y}" stroke="#d0d0d0" stroke-width="0.7"/>`;}).join('');
  const dataPolygons=records.map((rec,ri)=>{
    const col=GROUP_COLORS[ri%GROUP_COLORS.length];

// ─── グループ統計サマリー生成 ───
function groupStats(allRecords){
  const dims=['O','C','E','A','N'];
  const avg=d=>Math.round(allRecords.reduce((s,r)=>s+r.scores[d],0)/allRecords.length);
  const max=d=>Math.max(...allRecords.map(r=>r.scores[d]));
  const min=d=>Math.min(...allRecords.map(r=>r.scores[d]));
  const avgs=Object.fromEntries(dims.map(d=>[d,avg(d)]));
  // グループ全体の傾向コメント
  const highDims=dims.filter(d=>avgs[d]>=65).map(d=>DIMS[d].ja.name);
  const lowDims=dims.filter(d=>avgs[d]<40).map(d=>DIMS[d].ja.name);
  const spread=d=>max(d)-min(d); // ばらつき幅
  const wideDims=dims.filter(d=>spread(d)>=35).map(d=>DIMS[d].ja.name);
  let trend='';
  if(highDims.length>=2) trend+=`グループ全体として「${highDims.join('・')}」が高い傾向にあります。`;
  else if(highDims.length===1) trend+=`「${highDims[0]}」がグループ平均として高い水準です。`;
  else trend+='各軸ともバランスの取れたグループです。';
  if(lowDims.length>0) trend+=` 一方、「${lowDims.join('・')}」は全体的に低めです。`;
  if(wideDims.length>0) trend+=` 「${wideDims.join('・')}」はメンバー間のばらつきが大きく、個人差に注意が必要です。`;
  // 特徴的な候補者をピックアップ
  const topC=allRecords.reduce((a,b)=>a.scores.C>b.scores.C?a:b);
  const topA=allRecords.reduce((a,b)=>a.scores.A>b.scores.A?a:b);
  const lowN=allRecords.reduce((a,b)=>a.scores.N<b.scores.N?a:b);
  const highN=allRecords.reduce((a,b)=>a.scores.N>b.scores.N?a:b);
  return {avgs,max,min,spread,trend,topC,topA,lowN,highN,dims};
}

// ─── グループ内の個人位置づけコメント（傾向文） ───
function groupPositionComment(r, allRecords){
  const dims=['O','C','E','A','N'];
  const avg=d=>allRecords.reduce((s,x)=>s+x.scores[d],0)/allRecords.length;
  const rank=d=>{
    const sorted=[...allRecords].sort((a,b)=>b.scores[d]-a.scores[d]);
    return sorted.findIndex(x=>x.id===r.id)+1;
  };
  const n=allRecords.length;
  // 傾向語
  const highDesc={O:'新しいことへの適応力や好奇心がグループ内で際立っています',C:'責任感・計画性がグループの中でも特に高く、信頼度が高いといえます',E:'積極性・社交性がグループ内でトップクラスです',A:'チームワークを重んじる姿勢がグループ内で最も顕著です',N:'緊張・不安を感じやすい傾向がグループ内で最も強く出ています'};
  const lowDesc={O:'安定・慣れた環境を好む傾向がグループ内で最も強く出ています',C:'柔軟な対応を好む反面、グループ内では計画性が相対的に低めです',E:'物静かで内省的な傾向がグループ内でひときわ目立ちます',A:'自己主張が強い傾向がグループ内で最も際立っています',N:'感情的な安定感はグループ内でトップクラスです'};
  const highTrend={O:'好奇心・柔軟性が高め',C:'責任感・誠実さが高め',E:'積極性・社交性が高め',A:'協調性・思いやりが高め',N:'繊細さ・感受性が高め'};
  const lowTrend={O:'安定志向・慣れた環境を好む',C:'柔軟・自由なスタイルを好む',E:'内省的・落ち着いた姿勢',A:'自己主張が明確',N:'感情的に安定している'};
  const notable=[];
  dims.forEach(d=>{
    const diff=r.scores[d]-avg(d);
    const rk=rank(d);
    if(rk===1&&n>=3) notable.push(highDesc[d]);
    else if(rk===n&&n>=3) notable.push(lowDesc[d]);
    else if(diff>=20) notable.push(`${DIMS[d].ja.name}の面で${highTrend[d]}傾向があり、グループの平均を大きく上回っています`);
    else if(diff<=-20) notable.push(`${DIMS[d].ja.name}の面で${lowTrend[d]}傾向があり、グループの平均を下回っています`);
  });
  if(notable.length===0) return 'グループ内では各特性ともほぼ平均的な傾向にあり、バランスの取れたプロフィールです。';
  return notable.join('。')+'。';
}

async function saveEdits(){
  const btn=document.getElementById('saveEditsBtn');
  const msg=document.getElementById('saveEditsMsg');
  if(btn){btn.disabled=true;btn.textContent='保存中...';}
  if(msg){msg.textContent='';msg.style.color='rgba(255,255,255,0.5)';}

  // 変更があった行だけ収集
  const numInputs=[...document.querySelectorAll('[data-numset]')];
  const nameInputs=[...document.querySelectorAll('[data-nameset]')];
  const updates={};
  numInputs.forEach(inp=>{
    const id=inp.dataset.numset;
    const origNum=inp.dataset.origNum??'';
    const cur=inp.value;
    if(cur!==origNum){
      if(!updates[id])updates[id]={id};
      updates[id].interview_number=cur===''?null:parseInt(cur,10);
    }
  });
  nameInputs.forEach(inp=>{
    const id=inp.dataset.nameset;
    const origName=inp.dataset.origName??'';
    const cur=inp.value.trim();
    if(cur&&cur!==origName){
      if(!updates[id])updates[id]={id};
      updates[id].name=cur;
    }
  });

  const rows=Object.values(updates);
  if(rows.length===0){
    if(btn){btn.disabled=false;btn.textContent='💾 編集を保存';}
    if(msg){msg.textContent='変更はありません';setTimeout(()=>{msg.textContent='';},2000);}
    return;
  }

  // 1件ずつではなく、変更行のみ個別update（upsertはPKが必要なため）
  let saved=0;
  for(const row of rows){
    const {id,...fields}=row;
    const {error}=await sb.from('results').update(fields).eq('id',id);
    if(!error){
      saved++;
      const r=state.results.find(x=>x.id===id);
      if(r)Object.assign(r,fields);
      const s=state.selectedForPrint.find(x=>x.id===id);
      if(s)Object.assign(s,fields);
      // orig属性を更新（再保存時に再度変更扱いにならないよう）
      const ni=document.querySelector(`[data-numset="${id}"]`);
      if(ni)ni.dataset.origNum=ni.value;
      const ni2=document.querySelector(`[data-nameset="${id}"]`);
      if(ni2)ni2.dataset.origName=ni2.value.trim();
    }
  }

  if(btn){btn.disabled=false;btn.textContent='💾 編集を保存';}
  if(msg){
    const ok=saved===rows.length;
    msg.textContent=ok?`✅ ${saved}件保存しました`:`⚠️ ${saved}/${rows.length}件保存（一部失敗）`;
    msg.style.color=ok?'#5BC8AF':'#e63946';
    setTimeout(()=>{msg.textContent='';msg.style.color='rgba(255,255,255,0.5)';},3000);
  }
}

function printSelected(){
  // 番号順にソート（nullは末尾）
  const selected=[...state.selectedForPrint].sort((a,b)=>{
    const an=a.interview_number??Infinity;
    const bn=b.interview_number??Infinity;
    return an-bn;
  });
  if(selected.length===0){alert('印刷する候補者を選択してください');return;}
  const CHUNK=6;
  // 均等分割：できるだけ均等になるよう枚数を決める
  // 例）8人→ceil(8/6)=2グループ→4+4、16人→ceil(16/6)=3グループ→6+5+5
  const numChunks=Math.ceil(selected.length/CHUNK);
  const baseSize=Math.floor(selected.length/numChunks);
  const extra=selected.length%numChunks;
  // extraを後ろのグループから割り当て（前のグループをできるだけ大きく）
  // 例）7人→2グループ: 4+3ではなく最初を大きく→chunk0=4,chunk1=3
  // 実際は前から大きく: extra個のグループが(baseSize+1)人、残りがbaseSize人
  // 8人→base=4,extra=0→4+4 ✓  16人→base=5,extra=1→6+5+5 ✓  7人→base=3,extra=1→4+3
  const chunks=[];
  let pos=0;
  for(let ci=0;ci<numChunks;ci++){
    const size=baseSize+(ci<extra?1:0);
    chunks.push(selected.slice(pos,pos+size));
    pos+=size;
  }

  if(chunks.length===1){
    // 6人以内 → 1回で印刷
    const pages=[];
    pages.push(`<div class="page-break">${buildGroupSummaryPage(selected)}</div>`);
    pages.push(`<div class="page-break">${buildGroupRadarPage(selected)}</div>`);
    selected.forEach((r,i)=>{
      pages.push(`<div class="${i<selected.length-1?'page-break':''}">${buildIndividualPageWithGroup(r,selected)}</div>`);
    });
    const from=1, to=selected.length;
    document.title=`候補者診断結果_${from}～${to}`;
    document.getElementById('printArea').innerHTML=pages.join('');
    window.print();
    setTimeout(()=>{document.title='管理者ダッシュボード | Tokutei Ginou';},2000);
  } else {
    // 複数チャンク → 最初に全体サマリーを含む第1チャンクを印刷し、
    // 完了後に次のチャンクへ進む
    let ci=0;
    const printChunk=()=>{
      if(ci>=chunks.length) return;
      const chunk=chunks[ci];
      const globalOffset=chunks.slice(0,ci).reduce((s,c)=>s+c.length,0);
      const from=globalOffset+1;
      const to=globalOffset+chunk.length;
      const pages=[];
      if(ci===0){
        // 第1チャンクには全体グループサマリーを先頭に追加
        pages.push(`<div class="page-break">${buildGroupSummaryPage(selected)}</div>`);
      }
      pages.push(`<div class="page-break">${buildGroupRadarPage(chunk,ci+1,chunks.length)}</div>`);
      chunk.forEach((r,i)=>{
        pages.push(`<div class="${i<chunk.length-1?'page-break':''}">${buildIndividualPageWithGroup(r,selected)}</div>`);
      });
      document.title=`候補者診断結果_${from}～${to}`;
      document.getElementById('printArea').innerHTML=pages.join('');
      const next=()=>{
        ci++;
        if(ci<chunks.length){
          setTimeout(()=>{printChunk();},500);
        } else {
          setTimeout(()=>{document.title='管理者ダッシュボード | Tokutei Ginou';},2000);
        }
      };
      // afterprint イベントで次チャンクへ（1回のみ）
      const handler=()=>{window.removeEventListener('afterprint',handler);next();};
      window.addEventListener('afterprint',handler);
      window.print();
    };
    printChunk();
  }
}

// ─── STATE ───
function isAuthed(){return localStorage.getItem('tg_admin_authed')==='true';}
function setAuthed(v){if(v)localStorage.setItem('tg_admin_authed','true');else localStorage.removeItem('tg_admin_authed');}

let state={tab:'results',codes:[],results:[],detail:null,filterLang:'all',filterV:'all',newLang:'id',newNote:'',loading:false,copyMsg:{},pwErr:false,selectedForPrint:[]};

async function loadAll(){
  state.loading=true;render();
  const {data:codes}=await sb.from('codes').select('*').order('created_at',{ascending:false});
  const {data:results}=await sb.from('results').select('*').order('created_at',{ascending:false});
  state.codes=codes||[];state.results=results||[];
  state.loading=false;render();
}

async function addCode(){
  const farFuture=Date.now()+(100*365*24*60*60*1000);
  const c={code:genCode(),lang:state.newLang,note:state.newNote.trim()||null,created_at:Date.now(),expires_at:farFuture};
  await sb.from('codes').insert(c);
  state.newNote='';await loadAll();
}

async function deleteCode(code){
  await sb.from('codes').delete().eq('code',code);await loadAll();
}

function toggleSelect(r){
  const idx=state.selectedForPrint.findIndex(x=>x.id===r.id);
  if(idx>=0){state.selectedForPrint.splice(idx,1);}
  else{state.selectedForPrint.push(r);}
  render();
}

function clearSelection(){state.selectedForPrint=[];render();}

function getFiltered(){
  return state.results.filter(r=>{
    if(state.filterLang!=='all'&&r.lang!==state.filterLang)return false;
    if(state.filterV==='ok'&&!r.validity?.ok)return false;
    if(state.filterV==='warn'&&r.validity?.ok)return false;
    return true;
  });
}

// ─── RENDER ───
function render(){
  const app=document.getElementById('app');
  if(!isAuthed()){app.innerHTML=renderLogin();bindLogin();return;}
  if(state.detail){app.innerHTML=renderDetail(state.detail);bindDetail();return;}
  app.innerHTML=renderDashboard();bindDashboard();
}

    else{state.pwErr=true;render();}
  });
  document.getElementById('pwInput')?.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('loginBtn')?.click();});
}

  document.querySelectorAll('[data-tab]').forEach(btn=>btn.addEventListener('click',()=>{state.tab=btn.dataset.tab;render();}));

  document.querySelectorAll('[data-fv]').forEach(btn=>btn.addEventListener('click',()=>{state.filterV=btn.dataset.fv;render();}));

    printResult(getFiltered()[parseInt(btn.dataset.print)]);

  document.getElementById('printSelectedBtn')?.addEventListener('click',printSelected);

  document.getElementById('addCodeBtn')?.addEventListener('click',()=>{
    state.newLang=document.getElementById('newLangSel')?.value||'id';
    state.newNote=document.getElementById('newNoteInput')?.value||'';
    addCode();
  });
  document.getElementById('newNoteInput')?.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('addCodeBtn')?.click();});
  document.getElementById('newLangSel')?.addEventListener('change',e=>{state.newLang=e.target.value;});
  document.querySelectorAll('[data-copy]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const code=btn.dataset.copy;
      navigator.clipboard?.writeText(code);
      state.copyMsg[code]=true;render();
      setTimeout(()=>{state.copyMsg[code]=false;render();},1500);
    });
  });
  document.querySelectorAll('[data-delete]').forEach(btn=>btn.addEventListener('click',()=>{deleteCode(btn.dataset.delete);}));
}

function bindDetail(){
  document.getElementById('backBtn')?.addEventListener('click',()=>{state.detail=null;render();});
  document.getElementById('printBtn')?.addEventListener('click',()=>{printResult(state.detail);});
}

if(isAuthed()) loadAll(); else render();
</script>
</body>
</html>
