function getLevel(s){ return s>=70?'high':s>=40?'mid':'low'; }
function interpText(dim,s,lang){ return INTERP[dim][lang][getLevel(s)]; }
function fmt(dt){ return new Date(dt).toLocaleDateString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}); }
function fmtShort(dt){ return new Date(dt).toLocaleString('ja-JP',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}); }
function genCode(){ const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; const s=n=>Array.from({length:n},()=>c[Math.floor(Math.random()*c.length)]).join(''); return `${s(4)}-${s(4)}-${s(4)}`; }
function lv(s){ return s>=70?'高':s>=40?'中':'低'; }
function lc(s){ return s>=70?'#5BC8AF':s>=40?'#F4A261':'#9B8EF7'; }

function generateIQs(scores){
  const {O,C,E,A,N}=scores, qs=[];
  qs.push('日本での仕事に応募した理由・動機を教えてください。');
  if(O>=70) qs.push('経験したことのない業務に挑戦した具体的な経験を教えてください。');
  if(O<40)  qs.push('日本の職場は慣れない環境ですが、どのように適応する予定ですか？');
  if(C<40)  qs.push('過去に締め切りに間に合わなかった経験と、その対処法を教えてください。');
  if(C>=70) qs.push('仕事の品質を保つために日頃から心がけていることは何ですか？');
  if(E<40)  qs.push('慣れない職場での上司・同僚とのコミュニケーション方法を教えてください。');
  if(A<40)  qs.push('チームメンバーと意見が対立した際、どのように解決しましたか？');
  if(N>=70) qs.push('仕事でプレッシャーを感じた時、どのように気持ちを立て直しますか？');
  return qs;
}

function overallComment(scores){
  const {O,C,E,A,N}=scores, t=[];
  if(C>=70)t.push('誠実で責任感が強い'); if(A>=70)t.push('チームワークを大切にできる');
  if(E>=70)t.push('積極的でコミュニケーション力が高い'); if(N<=40)t.push('感情が安定している');
  if(O>=60)t.push('新しいことへの適応力がある');
  const p=t.length?t.join('・'):'バランスの取れた';
  const f=N>=70?'ストレス対処法や職場サポート体制':C<40?'業務の自己管理や責任感':'具体的な業務経験や意欲';
  return `この候補者は${p}タイプです。面接では「${f}」についてさらに確認することをお勧めします。`;
}

// ─── STATE ───
let state = {
  authed: false,
  pw: '',
  pwErr: false,
  tab: 'results',
  codes: [],
  results: [],
  detail: null,
  filterLang: 'all',
  filterV: 'all',
  newLang: 'id',
  newNote: '',
  loading: false,
  copyMsg: {},
};

// ─── SUPABASE ───
async function loadAll(){
  state.loading = true; render();
  const { data: codes } = await sb.from('codes').select('*').order('created_at', {ascending:false});
  const { data: results } = await sb.from('results').select('*').order('created_at', {ascending:false});
  state.codes = codes || [];
  state.results = results || [];
  state.loading = false; render();
}

async function addCode(){
  const c = { code:genCode(), lang:state.newLang, note:state.newNote.trim()||null, created_at:Date.now(), expires_at:Date.now()+CODE_EXPIRY_MS, used_at:null };
  await sb.from('codes').insert(c);
  state.newNote = '';
  await loadAll();
}

async function deleteCode(code){
  await sb.from('codes').delete().eq('code', code);
  await loadAll();
}

    <ol style="margin:0;padding-left:14pt;font-size:8.5pt">${qs.map(q=>`<li style="margin-bottom:3pt">${q}</li>`).join('')}</ol>
    ${!r.validity.ok?`<div style="margin-top:10pt;background:#fff8f0;border:1px solid #f4c87a;border-radius:5pt;padding:7pt 11pt;font-size:8.5pt"><b style="color:#c07030">⚠️ 回答信頼性：</b>実際より良く見せようとした可能性があります。面接での直接確認を重視してください。</div>`:''}
    <div style="margin-top:14pt;padding-top:6pt;border-top:1px solid #ddd;font-size:7.5pt;color:#aaa;display:flex;justify-content:space-between">
      <span>特定技能候補者 性格診断システム</span><span>コード：${r.code}</span>
    </div>`;
  window.print();
}

// ─── RENDER ───
function render(){
  const app = document.getElementById('app');
  if (!state.authed) { app.innerHTML = renderLogin(); bindLogin(); return; }
  if (state.detail)  { app.innerHTML = renderDetail(state.detail); bindDetail(); return; }
  app.innerHTML = renderDashboard();
  bindDashboard();
}

function renderLogin(){
  return `<div class="login-wrap"><div class="card-login">
    <div style="font-size:44px;margin-bottom:14px">🔐</div>
    <h1 style="font-size:22px;margin-bottom:6px">管理者ダッシュボード</h1>
    <p style="color:rgba(255,255,255,0.4);font-size:13px;margin-bottom:28px">特定技能候補者 性格診断管理システム</p>
    <input id="pwInput" type="password" placeholder="管理者パスワード" style="width:100%;text-align:center;margin-bottom:8px">
    ${state.pwErr?'<p class="error">パスワードが正しくありません</p>':''}
    <button class="btn btn-pink" id="loginBtn" style="width:100%;padding:14px;font-size:15px;margin-top:4px">ログイン</button>
  </div></div>`;
}

function renderDashboard(){
  const filtered = state.results.filter(r=>{
    if(state.filterLang!=='all'&&r.lang!==state.filterLang)return false;
    if(state.filterV==='ok'&&!r.validity.ok)return false;
    if(state.filterV==='warn'&&r.validity.ok)return false;
    return true;
  });

  const stats = [
    {l:'総受験者数',v:state.results.length,c:'#6C9BF7'},
    {l:'信頼性：良好',v:state.results.filter(r=>r.validity.ok).length,c:'#5BC8AF'},
    {l:'信頼性：要注意',v:state.results.filter(r=>!r.validity.ok).length,c:'#F4A261'},
    {l:'直近7日',v:state.results.filter(r=>Date.now()-new Date(r.date).getTime()<7*86400000).length,c:'#9B8EF7'},
  ];

  const validCodes = state.codes.filter(c=>!c.used_at&&Date.now()<c.expires_at).length;

  return `<div class="page">
    <!-- Header -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px">
      <div>
        <h1 style="font-size:22px;font-weight:800">🗂️ 管理者ダッシュボード</h1>
        <p style="color:rgba(255,255,255,0.4);margin-top:4px;font-size:12px">特定技能候補者 性格診断管理システム</p>
      </div>
      <button class="btn btn-ghost" id="refreshBtn">${state.loading?'読み込み中…':'🔄 最新に更新'}</button>
    </div>

    <!-- Tabs -->
    <div style="display:flex;gap:8px;margin-bottom:20px">
      <button class="tab-btn ${state.tab==='results'?'active':''}" data-tab="results">📊 受験結果一覧 (${state.results.length}件)</button>
      <button class="tab-btn ${state.tab==='codes'?'active':''}" data-tab="codes">🔑 コード管理 (${validCodes}件有効)</button>
    </div>

    ${state.tab==='results' ? renderResultsTab(filtered, stats) : renderCodesTab()}
  </div>`;
}

function renderResultsTab(filtered, stats){
  const langFilters = ['all','ja','id','my'].map(c=>{
    const active = state.filterLang===c;
    const label = c==='all'?'全言語':(LANGUAGES.find(l=>l.code===c)?.flag+' '+LANGUAGES.find(l=>l.code===c)?.label);
    return `<button class="filter-btn ${active?'active':''}" data-flang="${c}">${label}</button>`;
  }).join('');

  const vFilters = [['all','すべて'],['ok','✅ 良好'],['warn','⚠️ 要注意']].map(([v,l])=>{
    const active = state.filterV===v;
    return `<button class="filter-btn ${active?'active':''}" style="${active?'background:rgba(91,200,175,0.18);border-color:rgba(91,200,175,0.4);color:#5BC8AF':''}" data-fv="${v}">${l}</button>`;
  }).join('');

  const rows = filtered.length===0
    ? `<tr><td colspan="10" style="text-align:center;color:rgba(255,255,255,0.3);padding:40px">${state.results.length===0?'まだ受験データがありません':'条件に一致するデータがありません'}</td></tr>`
    : filtered.map((r,i)=>{
        const li = LANGUAGES.find(l=>l.code===r.lang);
        return `<tr data-idx="${i}">
          <td style="font-weight:700">${r.name}</td>
          <td><span style="font-size:15px">${li?.flag}</span></td>
          <td style="color:rgba(255,255,255,0.4);font-size:11px;white-space:nowrap">${fmt(r.date)}</td>
          <td><span class="badge" style="background:${r.validity.ok?'rgba(91,200,175,0.12)':'rgba(247,152,97,0.12)'};color:${r.validity.ok?'#5BC8AF':'#F4A261'}">${r.validity.ok?'✅':'⚠️'}</span></td>
          ${Object.entries(r.scores).map(([d,s])=>`<td style="text-align:center;color:${lc(s)};font-weight:800;font-size:13px">${s}</td>`).join('')}
          <td style="white-space:nowrap">
            <button class="btn-sm" style="background:rgba(108,155,247,0.18);border-color:rgba(108,155,247,0.3);color:#6C9BF7;margin-right:4px" data-detail="${i}">詳細</button>
            <button class="btn-sm" style="background:rgba(91,200,175,0.12);border-color:rgba(91,200,175,0.3);color:#5BC8AF" data-print="${i}">PDF</button>
          </td>
        </tr>`;
      }).join('');

  return `
    <!-- Stats -->
    <div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap">
      ${stats.map(s=>`<div class="glass stat-card"><div class="stat-val" style="color:${s.c}">${s.v}</div><div class="stat-lbl">${s.l}</div></div>`).join('')}
    </div>
    <!-- Filters -->
    <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center">
      ${langFilters}
      <div style="width:1px;background:rgba(255,255,255,0.1);margin:0 4px;height:20px"></div>
      ${vFilters}
    </div>
    <!-- Table -->
    <div class="glass" style="overflow-x:auto">
      <table>
        <thead><tr>
          <th>氏名/メモ</th><th>言語</th><th>受験日時</th><th>信頼性</th>
          <th>開放</th><th>誠実</th><th>外向</th><th>協調</th><th>神経</th><th>詳細/PDF</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

function renderCodesTab(){
  const rows = state.codes.length===0
    ? `<tr><td colspan="8" style="text-align:center;color:rgba(255,255,255,0.3);padding:40px">コードがまだ発行されていません</td></tr>`
    : state.codes.map((c,i)=>{
        const li = LANGUAGES.find(l=>l.code===c.lang);
        const expired = Date.now()>c.expires_at, used = !!c.used_at;
        const st = used?'used':expired?'expired':'active';
        const stStyle = {
          active: {bg:'rgba(91,200,175,0.12)',col:'#5BC8AF',label:'✅ 有効'},
          used:   {bg:'rgba(155,142,247,0.12)',col:'#9B8EF7',label:'✔ 使用済'},
          expired:{bg:'rgba(255,255,255,0.05)',col:'rgba(255,255,255,0.3)',label:'⏰ 期限切れ'},
        }[st];
        const copyBtn = st==='active'
          ? `<button class="btn-sm" style="background:${state.copyMsg[c.code]?'rgba(91,200,175,0.15)':'rgba(108,155,247,0.15)'};border-color:${state.copyMsg[c.code]?'rgba(91,200,175,0.3)':'rgba(108,155,247,0.3)'};color:${state.copyMsg[c.code]?'#5BC8AF':'#6C9BF7'}" data-copy="${c.code}">${state.copyMsg[c.code]?'✓ コピー済':'コピー'}</button>` : '';
        return `<tr style="opacity:${st!=='active'?0.55:1}">
          <td style="font-family:monospace;font-weight:700;letter-spacing:1px;font-size:13px">${c.code}</td>
          <td><span style="font-size:15px">${li?.flag}</span> <span style="color:rgba(255,255,255,0.4);font-size:11px">${li?.label}</span></td>
          <td style="color:rgba(255,255,255,0.6);font-size:12px">${c.note||'—'}</td>
          <td style="color:rgba(255,255,255,0.4);font-size:11px;white-space:nowrap">${fmtShort(c.created_at)}</td>
          <td style="color:rgba(255,255,255,0.4);font-size:11px;white-space:nowrap">${fmtShort(c.expires_at)}</td>
          <td><span class="badge" style="background:${stStyle.bg};color:${stStyle.col}">${stStyle.label}</span></td>
          <td>${copyBtn}</td>
          <td><button class="btn-sm" style="background:rgba(231,111,154,0.1);border-color:rgba(231,111,154,0.22);color:#E76F9A" data-delete="${c.code}">削除</button></td>
        </tr>`;
      }).join('');

  return `
    <!-- Issue new code -->
    <div class="glass" style="padding:20px;margin-bottom:14px">
      <h3 style="font-size:14px;font-weight:700;margin-bottom:12px">🔑 新規コード発行</h3>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
        <select id="newLangSel" style="padding:9px 12px">
          ${LANGUAGES.map(l=>`<option value="${l.code}" ${state.newLang===l.code?'selected':''}>${l.flag} ${l.label}</option>`).join('')}
        </select>
        <input id="newNoteInput" placeholder="メモ（候補者名など・任意）" style="flex:1;min-width:160px" value="${state.newNote}">
        <button class="btn btn-green" id="addCodeBtn">＋ 発行する</button>
      </div>
      <p style="color:rgba(255,255,255,0.3);font-size:11px;margin-top:8px">コードは発行から24時間有効・1回のみ使用可能です。</p>
    </div>
    <!-- Code list -->
    <div class="glass" style="overflow-x:auto">
      <table>
        <thead><tr>
          <th>コード</th><th>言語</th><th>メモ</th><th>発行日時</th><th>有効期限</th><th>状態</th><th>コピー</th><th>削除</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

function renderDetail(r){
  const li = LANGUAGES.find(l=>l.code===r.lang);
  const qs = generateIQs(r.scores);
  const scoreRows = Object.entries(r.scores).map(([d,s])=>`
    <div style="margin-bottom:9px">
      <div style="display:flex;justify-content:space-between;margin-bottom:3px">
        <span style="color:${DIMS[d].color};font-weight:700;font-size:12px">${DIMS[d].icon} ${DIMS[d].ja.name}</span>
        <span style="color:${lc(s)};font-weight:800;font-size:13px">${s}<span style="font-size:10px;opacity:0.6"> (${lv(s)})</span></span>
      </div>
      <div style="background:rgba(255,255,255,0.07);border-radius:4px;height:5px">
        <div style="width:${s}%;height:100%;background:linear-gradient(90deg,${DIMS[d].color}55,${DIMS[d].color});border-radius:4px"></div>
      </div>
    </div>`).join('');

  const interpColLang = Object.entries(r.scores).map(([d,s])=>`
    <div style="margin-bottom:10px">
      <span style="color:${DIMS[d].color};font-weight:700;font-size:12px">${DIMS[d].icon} ${DIMS[d][r.lang].name}</span>
      <p style="color:rgba(255,255,255,0.6);font-size:11px;margin:3px 0 0;line-height:1.6">${interpText(d,s,r.lang)}</p>
    </div>`).join('');

  const interpColJa = Object.entries(r.scores).map(([d,s])=>`
    <div style="margin-bottom:10px">
      <span style="color:${DIMS[d].color};font-weight:700;font-size:12px">${DIMS[d].icon} ${DIMS[d].ja.name}</span>
      <p style="color:rgba(255,255,255,0.6);font-size:11px;margin:3px 0 0;line-height:1.6">${interpText(d,s,'ja')}</p>
    </div>`).join('');

  return `<div class="page">
    <div style="display:flex;gap:10px;align-items:center;margin-bottom:20px;flex-wrap:wrap">
      <button class="btn btn-ghost" id="backBtn">← 一覧へ</button>
      <h2 style="font-size:18px;font-weight:800">${li?.flag} ${r.name}</h2>
      <span style="color:rgba(255,255,255,0.4);font-size:12px">${fmt(r.date)}</span>
      <span class="badge" style="background:${r.validity.ok?'rgba(91,200,175,0.15)':'rgba(247,152,97,0.15)'};color:${r.validity.ok?'#5BC8AF':'#F4A261'}">${r.validity.ok?'✅ 信頼性：良好':'⚠️ 信頼性：要注意'}</span>
      <button class="btn btn-green" id="printBtn" style="margin-left:auto">🖨️ PDF出力</button>
    </div>

    <!-- Score bars -->
    <div class="glass" style="padding:24px;margin-bottom:14px">${scoreRows}</div>

    <!-- Two columns -->
    <div style="display:flex;gap:12px;flex-wrap:wrap">
      <div class="glass" style="padding:18px;flex:1;min-width:260px">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,0.07)">
          <span style="font-size:18px">${li?.flag}</span>
          <span style="color:rgba(255,255,255,0.8);font-weight:700;font-size:13px">${li?.nativeName} (${li?.label})</span>
        </div>
        ${interpColLang}
      </div>
      <div class="glass" style="padding:18px;flex:1;min-width:260px;background:rgba(108,155,247,0.05);border-color:rgba(108,155,247,0.25)">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid rgba(108,155,247,0.15)">
          <span style="font-size:18px">🇯🇵</span>
          <span style="color:#6C9BF7;font-weight:700;font-size:13px">日本語サマリー（面接官用）</span>
        </div>
        ${interpColJa}
        <div style="background:rgba(108,155,247,0.1);border:1px solid rgba(108,155,247,0.2);border-radius:10px;padding:10px 12px;margin-top:10px">
          <p style="color:#6C9BF7;font-weight:700;font-size:11px;margin:0 0 4px">📋 総合所見</p>
          <p style="color:rgba(255,255,255,0.75);font-size:11px;margin:0 0 10px;line-height:1.8">${overallComment(r.scores)}</p>
          <p style="color:#F4A261;font-weight:700;font-size:11px;margin:0 0 6px">💬 推奨面接質問</p>
          ${qs.map((q,i)=>`<p style="color:rgba(255,255,255,0.7);font-size:11px;margin:0 0 4px;line-height:1.6"><b style="color:#F4A261">Q${i+1}.</b> ${q}</p>`).join('')}
        </div>
      </div>
    </div>
  </div>`;
}

// ─── BIND EVENTS ───
function bindLogin(){
  document.getElementById('loginBtn')?.addEventListener('click', ()=>{
    const pw = document.getElementById('pwInput')?.value;
    if(pw===ADMIN_PASSWORD){ state.authed=true; state.pwErr=false; loadAll(); }
    else { state.pwErr=true; render(); }
  });
  document.getElementById('pwInput')?.addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('loginBtn')?.click(); });
}

function bindDashboard(){
  document.getElementById('refreshBtn')?.addEventListener('click', loadAll);

  // Tabs
  document.querySelectorAll('[data-tab]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ state.tab=btn.dataset.tab; render(); });
  });

  // Lang filters
  document.querySelectorAll('[data-flang]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ state.filterLang=btn.dataset.flang; render(); });
  });

  // Validity filters
  document.querySelectorAll('[data-fv]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ state.filterV=btn.dataset.fv; render(); });
  });

  // Detail
  document.querySelectorAll('[data-detail]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ state.detail=state.results[parseInt(btn.dataset.detail)]; render(); });
  });

  // Print
  document.querySelectorAll('[data-print]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ printResult(state.results[parseInt(btn.dataset.print)]); });
  });

  // Add code
  document.getElementById('addCodeBtn')?.addEventListener('click', ()=>{
    state.newLang = document.getElementById('newLangSel')?.value || 'id';
    state.newNote = document.getElementById('newNoteInput')?.value || '';
    addCode();
  });
  document.getElementById('newNoteInput')?.addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('addCodeBtn')?.click(); });
  document.getElementById('newLangSel')?.addEventListener('change', e=>{ state.newLang=e.target.value; });

  // Copy
  document.querySelectorAll('[data-copy]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const code = btn.dataset.copy;
      navigator.clipboard?.writeText(code);
      state.copyMsg[code] = true;
      render();
      setTimeout(()=>{ state.copyMsg[code]=false; render(); }, 1500);
    });
  });

  // Delete
  document.querySelectorAll('[data-delete]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ deleteCode(btn.dataset.delete); });
  });
}

function bindDetail(){
  document.getElementById('backBtn')?.addEventListener('click', ()=>{ state.detail=null; render(); });
  document.getElementById('printBtn')?.addEventListener('click', ()=>{ printResult(state.detail); });
}

render();
</script>
</body>
</html>
